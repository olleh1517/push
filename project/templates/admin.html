<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>관리자 로그인 승인 모니터링</title>
  <script src="https://cdn.socket.io/4.0.1/socket.io.min.js"></script>
  <script>
    const adminSocket = io();

    adminSocket.on('login_request', function(data) {
      const list = document.getElementById('request-list');
      const item = document.createElement('li');
      item.id = data.request_id;
      item.innerText = `요청: ${data.email} (대기중)`;
      list.appendChild(item);
    });

    async function refreshStatuses() {
      const list = document.getElementById('request-list').children;
      for (let item of list) {
        const id = item.id;
        const res = await fetch(`/check-status/${id}`);
        const status = (await res.json()).status;
        item.innerText = item.innerText.split(' (')[0] + ` (${status})`;
      }
    }

    setInterval(refreshStatuses, 2000);
  </script>
</head>
<body>
  <h2>관리자 로그인 요청 리스트</h2>
  <ul id="request-list"></ul>
</body>
</html>
