<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>회원가입 (이메일 인증 + OTP)</title>
</head>
<body>
  <h1>회원가입</h1>

  <form id="emailForm">
    <label for="email">이메일:</label>
    <input type="email" id="email" required />
    <button type="submit">인증코드 요청</button>
  </form>

  <div id="verifySection" style="display:none;">
    <form id="verifyForm">
      <label for="code">인증코드:</label>
      <input type="text" id="code" required /><br /><br />

      <label for="password">비밀번호:</label>
      <input type="password" id="password" required /><br /><br />

      <button type="submit">가입 완료</button>
    </form>
  </div>

  <div id="otpSection" style="display:none;">
    <h3>OTP 앱에 아래 QR 코드를 등록해주세요</h3>
    <img id="otpQr" src="" alt="QR Code" />
    <p><small id="otpLink" style="word-break: break-all;"></small></p>
  </div>

  <p id="message" style="color: red;"></p>
  <p><button onclick="location.href='/login'">로그인으로 이동</button></p>

  <script>
    const emailForm = document.getElementById('emailForm');
    const verifySection = document.getElementById('verifySection');
    const verifyForm = document.getElementById('verifyForm');
    const otpSection = document.getElementById('otpSection');
    const otpQr = document.getElementById('otpQr');
    const otpLink = document.getElementById('otpLink');
    const messageP = document.getElementById('message');

    let userEmail = '';

    emailForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      userEmail = document.getElementById('email').value;

      const res = await fetch('/request-signup-code', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: userEmail })
      });

      const data = await res.json();
      if (res.ok) {
        messageP.textContent = '이메일로 인증코드를 보냈습니다.';
        verifySection.style.display = 'block';
        emailForm.style.display = 'none';
      } else {
        messageP.textContent = data.message || '인증코드 요청 실패';
      }
    });

    verifyForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const code = document.getElementById('code').value;
      const password = document.getElementById('password').value;

      const verifyRes = await fetch('/verify-signup-code', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: userEmail, code })
      });

      const verifyData = await verifyRes.json();
      if (!verifyRes.ok || verifyData.status !== 'ok') {
        messageP.textContent = verifyData.message || '인증코드 검증 실패';
        return;
      }

      const signupRes = await fetch('/signup', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: userEmail, password })
      });

      const signupData = await signupRes.json();
      if (signupRes.ok && signupData.status === 'ok') {
        messageP.textContent = signupData.message;
        verifySection.style.display = 'none';

        const otpUri = signupData.otp_uri;
        otpQr.src = `https://api.qrserver.com/v1/create-qr-code/?data=${encodeURIComponent(otpUri)}&size=200x200`;
        otpLink.textContent = otpUri;
        otpSection.style.display = 'block';
      } else {
        messageP.textContent = signupData.message || '가입 실패';
      }
    });
  </script>
</body>
</html>
