<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>회원가입 (이메일 인증 + 비밀번호 + 기기 토큰)</title>
</head>
<body>
  <h1>회원가입</h1>

  <!-- 1단계: 이메일로 인증코드 요청 + device_token 자동 생성 -->
  <form id="signupForm">
    <label for="email">이메일:</label>
    <input type="email" id="email" name="email" required />
    <br />
    <button type="submit">인증코드 요청</button>
  </form>

  <!-- 2단계: 인증코드 + 비밀번호 입력 -->
  <div id="verifySection" style="display:none;">
    <h2>인증코드 입력 및 비밀번호 설정</h2>
    <form id="verifyForm">
      <label for="code">인증코드:</label>
      <input type="text" id="code" name="code" required />
      <br /><br />
      <label for="password">비밀번호:</label>
      <input type="password" id="password" name="password" required />
      <br /><br />
      <button type="submit">가입 완료</button>
    </form>
  </div>

  <p id="message"></p>

  <script>
    const signupForm = document.getElementById('signupForm');
    const verifySection = document.getElementById('verifySection');
    const verifyForm = document.getElementById('verifyForm');
    const messageP = document.getElementById('message');
    let userEmail = '';
    let approvalCheckInterval = null;

    function getOrCreateDeviceToken() {
      let token = localStorage.getItem('device_token');
      if (!token) {
        if (crypto && crypto.randomUUID) {
          token = crypto.randomUUID();
        } else {
          token = 'xxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
            const r = Math.random() * 16 | 0, v = c === 'x' ? r : (r & 0x3 | 0x8);
            return v.toString(16);
          });
        }
        localStorage.setItem('device_token', token);
      }
      return token;
    }

    signupForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      userEmail = signupForm.email.value;
      const deviceToken = getOrCreateDeviceToken();

      const res = await fetch('/signup', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
          email: userEmail,
          device_token: deviceToken
        })
      });

      const data = await res.json();
      if (res.ok) {
        messageP.textContent = data.message;
        signupForm.style.display = 'none';
        verifySection.style.display = 'block';
      } else {
        messageP.textContent = data.error || '오류가 발생했습니다.';
      }
    });

    verifyForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const code = verifyForm.code.value;
      const password = verifyForm.password.value;
      const deviceToken = getOrCreateDeviceToken();

      const res = await fetch('/verify-email', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
          email: userEmail,
          code: code,
          password: password,
          device_token: deviceToken
        })
      });

      const data = await res.json();
      if (res.ok && data.status === 'pending') {
        messageP.textContent = '가입 신청 완료. 관리자의 승인을 기다려 주세요.';
        verifySection.style.display = 'none';

        approvalCheckInterval = setInterval(async () => {
          const res = await fetch('/check-approval', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email: userEmail })
          });

          const result = await res.json();
          if (result.status === 'approved') {
            clearInterval(approvalCheckInterval);
            messageP.textContent = '가입이 승인되었습니다! 로그인 페이지로 이동하세요.';

            // 3초 후 처음 화면으로 돌아가기
            setTimeout(() => {
              resetToInitial();
            }, 3000);
          }
        }, 3000);

      } else if (res.ok && data.status === 'ok') {
        messageP.textContent = '가입이 완료되었습니다. 로그인 페이지로 이동하세요.';
        verifySection.style.display = 'none';

        setTimeout(() => {
          resetToInitial();
        }, 3000);
      } else {
        messageP.textContent = data.message || '인증 실패';
      }
    });

    function resetToInitial() {
      // 승인확인 인터벌 있으면 종료
      if (approvalCheckInterval) {
        clearInterval(approvalCheckInterval);
        approvalCheckInterval = null;
      }
      userEmail = '';
      signupForm.email.value = '';
      verifyForm.code.value = '';
      verifyForm.password.value = '';
      messageP.textContent = '';
      signupForm.style.display = 'block';
      verifySection.style.display = 'none';
    }
  </script>
</body>
</html>
