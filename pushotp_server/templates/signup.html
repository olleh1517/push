<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>회원가입 (이메일 인증 + 비밀번호 + 기기 토큰)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root {
      --primary: #007bff;
      --primary-dark: #0056b3;
      --accent: #00b894;
      --danger: #e17055;
      --bg: #f4f6fa;
      --card-bg: #fff;
      --card-shadow: 0 2px 16px rgba(0,0,0,0.07);
      --radius: 14px;
      --input-bg: #f8fafc;
      --input-border: #d0d7e2;
      --input-focus: #b3d7ff;
    }
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      background: var(--bg);
    }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', 'Noto Sans KR', Arial, sans-serif;
      color: #222;
    }
    .signup-container {
      background: var(--card-bg);
      border-radius: var(--radius);
      box-shadow: var(--card-shadow);
      padding: 38px 30px 30px 30px;
      min-width: 272px;
      max-width: 76vw;
      width: 80%;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      align-items: stretch;
      gap: 18px;
      animation: fadeIn 0.7s;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(30px);}
      to { opacity: 1; transform: translateY(0);}
    }
    .signup-container h1 {
      text-align: center;
      font-size: 2rem;
      margin-bottom: 10px;
      color: var(--primary-dark);
      font-weight: 700;
      letter-spacing: 1px;
    }
    .signup-container h2 {
      color: var(--primary-dark);
      font-size: 1.15rem;
      margin-bottom: 18px;
      text-align: center;
    }
    form label {
      font-weight: 500;
      margin-bottom: 4px;
      display: block;
      color: #333;
    }
    form input[type="email"],
    form input[type="password"],
    form input[type="text"] {
      width: 100%;
      padding: 12px 10px;
      margin-bottom: 12px;
      border: 1.5px solid var(--input-border);
      border-radius: 7px;
      background: var(--input-bg);
      font-size: 1rem;
      transition: border 0.2s;
      box-sizing: border-box;
    }
    form input:focus {
      border-color: var(--input-focus);
      outline: none;
      background: #f6fbff;
    }
    .btn {
      width: 80%;
      padding: 12px 0;
      border: none;
      border-radius: 7px;
      font-size: 1.08rem;
      font-weight: 600;
      background: var(--primary);
      color: #fff;
      cursor: pointer;
      margin-bottom: 8px;
      transition: background 0.18s, box-shadow 0.18s, transform 0.13s;
      box-shadow: 0 2px 8px rgba(0,123,255,0.07);
      display: block;
      margin-left: auto;
      margin-right: auto;
    }
    .btn:hover, .btn:focus {
      background: var(--primary-dark);
      transform: translateY(-2px) scale(1.03);
    }
    .btn-accent {
      background: var(--accent);
      color: #fff;
    }
    .btn-accent:hover, .btn-accent:focus {
      background: #009e74;
    }
    .btn-outline {
      background: #fff;
      color: var(--primary-dark);
      border: 1.5px solid var(--primary-dark);
    }
    .btn-outline:hover, .btn-outline:focus {
      background: var(--primary-dark);
      color: #fff;
    }
    #message {
      min-height: 22px;
      text-align: center;
      font-size: 1.02rem;
      margin: 0 0 8px 0;
      color: var(--danger);
      font-weight: 500;
      transition: color 0.2s;
    }
    #message.success {
      color: var(--accent);
    }
    @media (max-width: 600px) {
      .signup-container {
        min-width: 0;
        padding: 18px 4vw;
        width: 96%;
        max-width: 98vw;
      }
      .signup-container h1 { font-size: 1.3rem; }
    }
  </style>
</head>
<body>
  <div class="signup-container">
    <h1>회원가입</h1>
    <form id="signupForm">
      <label for="email">이메일</label>
      <input type="email" id="email" name="email" required autocomplete="username" />
      <button type="submit" class="btn">인증코드 요청</button>
    </form>

    <div id="verifySection" style="display:none;">
      <h2>인증코드 입력 및 비밀번호 설정</h2>
      <form id="verifyForm">
        <label for="code">인증코드</label>
        <input type="text" id="code" name="code" required />
        <label for="password">비밀번호</label>
        <input type="password" id="password" name="password" required />
        <button type="submit" class="btn btn-accent">가입 완료</button>
      </form>
    </div>

    <button type="button" class="btn btn-outline" onclick="location.href='/login'">로그인하러 가기</button>
    <div id="message"></div>
  </div>
  <script>
    const signupForm = document.getElementById('signupForm');
    const verifySection = document.getElementById('verifySection');
    const verifyForm = document.getElementById('verifyForm');
    const messageP = document.getElementById('message');
    let userEmail = '';

    function getOrCreateDeviceToken() {
      let token = localStorage.getItem('device_token');
      if (!token) {
        token = crypto?.randomUUID?.() || 'xxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
          const r = Math.random() * 16 | 0, v = c === 'x' ? r : (r & 0x3 | 0x8);
          return v.toString(16);
        });
        localStorage.setItem('device_token', token);
      }
      return token;
    }

    signupForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      userEmail = signupForm.email.value;
      const deviceToken = getOrCreateDeviceToken();

      const res = await fetch('/signup', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: userEmail, device_token: deviceToken })
      });

      const data = await res.json();
      if (res.ok) {
        messageP.textContent = data.message;
        messageP.classList.remove('success');
        signupForm.style.display = 'none';
        verifySection.style.display = 'block';
      } else {
        messageP.textContent = data.error || '오류가 발생했습니다.';
        messageP.classList.remove('success');
      }
    });

    verifyForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const code = verifyForm.code.value;
      const password = verifyForm.password.value;
      const deviceToken = getOrCreateDeviceToken();

      const res = await fetch('/verify-email', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: userEmail, code, password, device_token: deviceToken })
      });

      const data = await res.json();
      if (res.ok && data.status === 'ok') {
        messageP.textContent = '가입이 완료되었습니다! 로그인 페이지로 이동하세요.';
        messageP.classList.add('success');
        verifySection.style.display = 'none';

        setTimeout(() => {
          location.href = '/login';
        }, 3000);
      } else {
        messageP.textContent = data.message || '인증 실패';
        messageP.classList.remove('success');
      }
    });
  </script>
</body>
</html>
