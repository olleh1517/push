<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>로그인 (이메일+비밀번호+기기 토큰)</title>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyCYvJ0zPJ1JQpS9A3VsDd3c_U059ZAY12w",
      authDomain: "pushotp-49168.firebaseapp.com",
      projectId: "pushotp-49168",
      storageBucket: "pushotp-49168.firebasestorage.app",
      messagingSenderId: "335414278200",
      appId: "1:335414278200:web:e4ca22178af1834ca84ecd",
      measurementId: "G-H1FK55D42Q"
    };
    firebase.initializeApp(firebaseConfig);
  </script>
</head>
<body>
  <h1>로그인</h1>

  <form id="loginForm">
    <label for="email">이메일:</label>
    <input type="email" id="email" name="email" required />
    <br />
    <label for="password">비밀번호:</label>
    <input type="password" id="password" name="password" required />
    <br />
    <button type="submit" id="loginBtn">로그인</button>
    <button type="button" id="registerDeviceBtn" style="display:none;">기기 등록</button>
  </form>

  <div id="verifyDeviceSection" style="display:none;">
    <h3>기기 등록 인증</h3>
    <input type="text" id="deviceCodeInput" placeholder="이메일로 받은 인증코드 입력" />
    <button id="verifyDeviceBtn">기기 인증 완료</button>
  </div>

  <p>
    <button type="button" onclick="location.href='/signup'">계정 생성하기</button>
  </p>

  <p>
    <span id="toggleRegister" style="color:blue; text-decoration:underline; cursor:pointer;">
      새로운 기기를 등록하시겠습니까?
    </span>
  </p>

  <div id="welcomeSection" style="display:none;">
    <h2 id="welcomeMessage"></h2>
    <button id="logoutBtn">로그아웃</button>
  </div>

  <p id="message" style="color:red;"></p>

  <script>
    const loginForm = document.getElementById('loginForm');
    const loginBtn = document.getElementById('loginBtn');
    const registerDeviceBtn = document.getElementById('registerDeviceBtn');
    const toggleRegister = document.getElementById('toggleRegister');
    const messageP = document.getElementById('message');
    const welcomeSection = document.getElementById('welcomeSection');
    const welcomeMessage = document.getElementById('welcomeMessage');
    const logoutBtn = document.getElementById('logoutBtn');
    const verifyDeviceSection = document.getElementById('verifyDeviceSection');
    const deviceCodeInput = document.getElementById('deviceCodeInput');
    const verifyDeviceBtn = document.getElementById('verifyDeviceBtn');

    let isRegisteringDevice = false;

    function getOrCreateDeviceToken() {
      let token = localStorage.getItem('device_token');
      if (!token) {
        token = crypto?.randomUUID?.() || 'xxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
          const r = Math.random() * 16 | 0, v = c === 'x' ? r : (r & 0x3 | 0x8);
          return v.toString(16);
        });
        localStorage.setItem('device_token', token);
      }
      return token;
    }

    toggleRegister.addEventListener('click', () => {
      isRegisteringDevice = !isRegisteringDevice;
      loginBtn.style.display = isRegisteringDevice ? 'none' : 'inline-block';
      registerDeviceBtn.style.display = isRegisteringDevice ? 'inline-block' : 'none';
      verifyDeviceSection.style.display = 'none';
      toggleRegister.textContent = isRegisteringDevice ? '기기 등록 취소' : '새로운 기기를 등록하시겠습니까?';
      messageP.textContent = '';
    });

    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();

      const email = loginForm.email.value;
      const password = loginForm.password.value;
      const deviceToken = getOrCreateDeviceToken();

      const res = await fetch('/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password, device_token: deviceToken })
      });

      const data = await res.json();
      if (res.ok && data.status === 'ok') {
        if (email === 'admin123@naver.com') {
          window.open('/admin', '_blank');
          messageP.textContent = '관리자 로그인 성공!';
        } else {
          welcomeMessage.textContent = `${email}님 환영합니다!`;
          welcomeSection.style.display = 'block';
          loginForm.style.display = 'none';
          messageP.textContent = '';
        }
      } else {
        messageP.textContent = '로그인 실패: ' + (data.message || '알 수 없는 오류');
      }
    });

    registerDeviceBtn.addEventListener('click', async () => {
      const email = loginForm.email.value;
      const deviceToken = getOrCreateDeviceToken();

      if (!email) {
        messageP.textContent = '이메일을 입력하세요.';
        return;
      }

      const res = await fetch('/request-device-code', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, device_token: deviceToken })
      });

      const data = await res.json();
      if (res.ok && data.status === 'ok') {
        messageP.textContent = '이메일로 인증코드를 전송했습니다.';
        verifyDeviceSection.style.display = 'block';
      } else {
        messageP.textContent = data.message || '기기 인증 요청 실패';
      }
    });

    verifyDeviceBtn.addEventListener('click', async () => {
      const email = loginForm.email.value;
      const code = deviceCodeInput.value;
      const deviceToken = getOrCreateDeviceToken();

      const res = await fetch('/verify-device-code', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, code, device_token: deviceToken })
      });

      const data = await res.json();
      if (res.ok && data.status === 'ok') {
        messageP.style.color = 'green';
        messageP.textContent = '기기 등록이 완료되었습니다.';
        verifyDeviceSection.style.display = 'none';
      } else {
        messageP.style.color = 'red';
        messageP.textContent = data.message || '기기 인증 실패';
      }
    });

    logoutBtn.addEventListener('click', async () => {
      try {
        await firebase.auth().signOut();
        welcomeSection.style.display = 'none';
        loginForm.style.display = 'block';
        messageP.style.color = 'black';
        messageP.textContent = '로그아웃 되었습니다.';
      } catch (error) {
        messageP.style.color = 'red';
        messageP.textContent = '로그아웃 실패: ' + error.message;
      }
    });
  </script>
</body>
</html>
