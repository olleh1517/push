<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>로그인 (이메일+비밀번호+OTP)</title>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyCYvJ0zPJ1JQpS9A3VsDd3c_U059ZAY12w",
      authDomain: "pushotp-49168.firebaseapp.com",
      projectId: "pushotp-49168",
      storageBucket: "pushotp-49168.firebasestorage.app",
      messagingSenderId: "335414278200",
      appId: "1:335414278200:web:e4ca22178af1834ca84ecd",
      measurementId: "G-H1FK55D42Q"
    };
    firebase.initializeApp(firebaseConfig);
  </script>
</head>
<body>
  <h1>로그인</h1>

  <form id="loginForm">
    <label for="email">이메일:</label>
    <input type="email" id="email" required />
    <br />
    <label for="password">비밀번호:</label>
    <input type="password" id="password" required />
    <br />
    <label for="otp">OTP 코드:</label>
    <input type="text" id="otp" required />
    <br />
    <button type="submit">로그인</button>
  </form>

  <p>
    <button type="button" onclick="location.href='/signup'">계정 생성하기</button>
  </p>

  <div id="welcomeSection" style="display:none;">
    <h2 id="welcomeMessage"></h2>
    <button id="logoutBtn">로그아웃</button>
  </div>

  <p id="message" style="color:red;"></p>

  <script>
    const loginForm = document.getElementById('loginForm');
    const messageP = document.getElementById('message');
    const welcomeSection = document.getElementById('welcomeSection');
    const welcomeMessage = document.getElementById('welcomeMessage');
    const logoutBtn = document.getElementById('logoutBtn');

    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();

      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const otp = document.getElementById('otp').value;

      const res = await fetch('/login-otp', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password, otp })
      });

      const data = await res.json();
      if (res.ok && data.status === 'ok') {
        welcomeMessage.textContent = `${email}님 환영합니다!`;
        welcomeSection.style.display = 'block';
        loginForm.style.display = 'none';
        messageP.textContent = '';
      } else {
        messageP.textContent = '로그인 실패: ' + (data.message || '알 수 없는 오류');
      }
    });

    logoutBtn.addEventListener('click', async () => {
      try {
        await firebase.auth().signOut();
        welcomeSection.style.display = 'none';
        loginForm.style.display = 'block';
        messageP.style.color = 'black';
        messageP.textContent = '로그아웃 되었습니다.';
      } catch (error) {
        messageP.style.color = 'red';
        messageP.textContent = '로그아웃 실패: ' + error.message;
      }
    });
  </script>
</body>
</html>
