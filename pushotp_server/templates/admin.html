<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>관리자 - 로그인 기록</title>
</head>
<body>
  <h1>로그인 기록</h1>
  <table border="1" cellpadding="8" cellspacing="0">
    <thead>
      <tr>
        <th>이메일</th>
        <th>로그인 시간</th>
        <th>상태</th>
        <th>사유</th>
      </tr>
    </thead>
    <tbody>
      {% for log in logs %}
      <tr>
        <td>{{ log.email }}</td>
        <td>{{ log.timestamp }}</td>
        <td>{{ log.status or 'N/A' }}</td>
        <td>{{ log.reason or '' }}</td>
      </tr>
      {% else %}
      <tr>
        <td colspan="4">로그인 기록이 없습니다.</td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
</body>
</html>
