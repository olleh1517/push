<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>관리자 - 로그인 기록</title>
  <style>
    body {
      font-family: sans-serif;
      margin: 0;
      display: flex;
    }

    .sidebar {
      width: 200px;
      background-color: #f2f2f2;
      padding: 20px;
      height: 100vh;
      box-shadow: 2px 0 5px rgba(0,0,0,0.1);
    }

    .sidebar h3 {
      margin-top: 0;
    }

    .sidebar a {
      display: block;
      margin-bottom: 10px;
      padding: 10px;
      text-align: center;
      background-color: #007bff;
      color: white;
      text-decoration: none;
      border-radius: 4px;
    }

    .sidebar a:hover {
      background-color: #0056b3;
    }

    .main {
      flex-grow: 1;
      padding: 20px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th, td {
      border: 1px solid #ccc;
      padding: 8px;
      text-align: center;
    }

    th {
      background-color: #e9e9e9;
    }
  </style>
</head>
<body>

  <div class="sidebar">
    <h3>관리자 메뉴</h3>
    <a href="/admin">로그인 기록</a>
  </div>

  <div class="main">
    <h1>로그인 기록</h1>
    <table>
      <thead>
        <tr>
          <th>이메일</th>
          <th>로그인 시간</th>
          <th>상태</th>
          <th>사유</th>
        </tr>
      </thead>
      <tbody>
        {% for log in logs %}
        <tr>
          <td>{{ log.email }}</td>
          <td>{{ log.timestamp }}</td>
          <td>{{ log.status or 'N/A' }}</td>
          <td>{{ log.reason or '' }}</td>
        </tr>
        {% else %}
        <tr>
          <td colspan="4">로그인 기록이 없습니다.</td>
        </tr>
        {% endfor %}
      </tbody>
    </table>
  </div>

</body>
</html>
